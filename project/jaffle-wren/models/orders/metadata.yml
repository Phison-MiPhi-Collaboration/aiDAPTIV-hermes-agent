name: orders
properties:
  description: "Table containing order details, status, and amounts."
table_reference:
  catalog: "jaffle_shop"
  schema: main
  table: orders
primary_key: order_id
columns:
  - name: order_id
    type: INTEGER
    not_null: true
  - name: customer_id
    type: INTEGER
  - name: order_date
    type: DATE
  - name: status
    type: VARCHAR
  - name: credit_card_amount
    type: DOUBLE
  - name: coupon_amount
    type: DOUBLE
  - name: bank_transfer_amount
    type: DOUBLE
  - name: gift_card_amount
    type: DOUBLE
  - name: amount
    type: DOUBLE
